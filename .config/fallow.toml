entry = [
	"scripts/**/*.ts",
	"packages/bench/run.ts",
	"packages/bench/main.tsx",
	"packages/bench/size/*.tsx",
	# run.ts aliases @reatom/jsx's jsx-runtime to it.
	"packages/bench/reatomJsxRuntime.ts",
]
# `@typescript/native`: TypeScript 7 compiler, not imported by source.
# `idb-keyval`: optional dependency of @reatom/core. The Storybook/Vite optimizer
# eagerly analyzes its dynamic import, so the package must remain resolvable.
# `storybook`: imported by the kahraman actor harness but never runs in production.
# `@ark-ui/react`: consumed by the excluded generated Park UI component sources.
# Steiger and its FSD plugin are loaded by the excluded tooling config and mise task.
# `zod`: pins zod 4 at the root of the hoisted tree; better-auth imports it
# without declaring a nested copy, and steiger's zod 3 would win otherwise.
ignoreDependencies = [
	"@ark-ui/react",
	"@feature-sliced/steiger-plugin",
	"@typescript/native",
	"idb-keyval",
	"steiger",
	"storybook",
	"zod",
]

# The skeleton keeps these shared extension points even when its starter screens do not
# consume them yet.
ignoreExports = [
	# PostCSS loads this CommonJS config by convention.
	{ file = "postcss.config.cjs", exports = ["plugins"] },
	{ file = "src/shared/api/index.ts", exports = ["isApiError"] },
	{ file = "src/shared/components/CollectionSelect.tsx", exports = ["CollectionSelect"] },
	{ file = "src/shared/components/index.ts", exports = ["CollectionSelect"] },
	{ file = "src/shared/model/index.ts", exports = ["reatomLoc", "withMatchMobileHeaderOverride"] },
	{ file = "src/shared/model/locale.ts", exports = ["reatomLoc"] },
	{ file = "src/shared/router.ts", exports = ["createSearchParamsPath"] },
	{ file = "src/shared/test/index.ts", exports = ["link", "withDetailError"] },
	{ file = "src/shared/test/pageActor.ts", exports = ["withDetailError"] },
	{ file = "src/widgets/data-page/index.ts", exports = ["ListToolbar", "NoSelectionState"] },
	{ file = "src/widgets/data-page/ui/ListToolbar.tsx", exports = ["ListToolbar"] },
	{ file = "src/widgets/data-page/ui/NoSelectionState.tsx", exports = ["NoSelectionState"] },
]

# Park UI and generated assets are committed vendor/generated code.
ignorePatterns = [
	"public/mockServiceWorker.js",
	"scripts/steiger/steiger.config.ts",
	"src/paraglide/**",
	"src/shared/components/ui/**",
	"src/shared/styled-system/**",
	"theme/recipes/**",
]

# Pin the Convex libraries' `convex` to the app's. Fallow reads pnpm
# lockfiles, not nub.lock, so it cannot see them applied.
ignoreDependencyOverrides = [
	{ package = "@convex-dev/auth>convex" },
	{ package = "@convex-dev/better-auth>convex" },
	{ package = "convex-helpers>convex" },
	{ package = "convex-test>convex" },
]

[duplicates]
ignore = ["messages/**", "src/**/*.stories.tsx"]
ignoreImports = true
